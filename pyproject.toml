[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "pressbox-war-room"
version = "1.0.0"
description = "Multi-Agent MLB & NHL Scouting & Matchup War Room built with Google Agent Development Kit (ADK)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "PressBox War Room Contributors" }
]
keywords = [
    "google-adk",
    "multi-agent",
    "sports-analytics",
    "baseball",
    "mlb",
    "ice-hockey",
    "nhl",
    "vertex-ai",
    "opentelemetry",
]
dependencies = [
    "google-adk>=1.0.0",
    "google-genai>=1.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "httpx>=0.27.0",
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
]

[project.optional-dependencies]
gcp = [
    "google-cloud-aiplatform[adk,agent_engines]>=1.70.0",
    "opentelemetry-exporter-gcp-trace>=1.7.0",
]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["pressbox_war_room"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["E501"]
